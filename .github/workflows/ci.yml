name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: nothing here is worth
# paying for twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22+ is a hard requirement, not a preference: the sync server uses
      # node:sqlite, which does not exist before it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Runs vendor-ocr first, which fetches the ~7 MB Tesseract French model.
      # If that ever becomes flaky in CI, cache `.cache/` rather than skipping
      # the build, since bundling is where route splitting actually breaks.
      - name: Build
        run: npm run build

      # Runs after the build so it can measure dist/. Exits non-zero only on a
      # correctness failure (an identifier the roster HOLDS survived a scrub, or
      # clinical content was destroyed), never on an accuracy number, so a model
      # that is simply absent cannot fail the build.
      - name: Evaluate
        run: npm run eval | tee eval-report.txt

      # The claim the whole project rests on, checked in a real browser against
      # the real build: open with no network, sign in, record a consultation,
      # reload, and still have it. Unit tests cannot see the service worker,
      # the precache manifest or IndexedDB persistence working together, and a
      # precache that missed the shell fails in front of an audience.
      #
      # ubuntu-latest ships Chromium; CHROME_PATH points puppeteer-core at it
      # rather than downloading a second browser.
      - name: Offline smoke walk
        run: |
          npx vite preview --port 4173 &
          # Plain curl loop rather than `npx wait-on`, which would fetch a
          # package at CI time to do what four lines of shell already does.
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173 && break
            sleep 1
          done
          CHROME_PATH="$(command -v chromium || command -v chromium-browser || command -v google-chrome)" \
            npm run smoke

      - name: Report
        if: always()
        run: |
          {
            echo '### Evaluation'
            echo '```'
            cat eval-report.txt || true
            echo '```'
            echo '### Bundle'
            echo '```'
            ls -lh dist/assets/*.js dist/assets/*.css | awk '{print $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
